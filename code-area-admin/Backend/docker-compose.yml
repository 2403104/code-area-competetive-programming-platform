version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis/redis-stack:latest
    container_name: codearea-redis
    ports:
      - "6380:6379"
      - "8001:8001"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data: